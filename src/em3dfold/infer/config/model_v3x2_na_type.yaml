model:
  module: em3dfold.models.v3x2_na_type.model
  class_name: Model
  args:
    n_block: 12
    use_checkpoint: false
    d_node: 256
    d_edge: 128
    d_head: 48
    n_qk_point: 4
    n_v_point: 8
    n_head: 8
    k: 32
    c_grid: 1
    d_cryo_emb: 256
    cube_size: 23
    rectangle_length: 15
    pred_node_exist: false
    pred_edge_exist: true
    pred_pairing: false
    pred_ss: true
    pred_na_type: true
    use_edge_pairing_input: true
    use_index_pos: true
    node_pos_enc_dim: 16
    edge_pos_enc_dim: 16
    max_rel_res_offset: 64
    residue_pos_scale: 32.0
    use_seq_attn: true
    seq_attn_every: 2
    geometry_update_every: 4
    recycle_use_full_structure: true
    cube_scunet_head_dim: 16
    cube_scunet_window_size: 3
    cube_scunet_drop_path: 0.0
    cube_scunet_trans_ratio: 0.25
    cube_scunet_max_trans_dim: 128
